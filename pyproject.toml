[tool.pylint]
# Monorepo lint convention: this single root file is the shared rule set
# for every top-level project, and CI lints each project in its own pylint
# invocation (.github/workflows/pylint.yml). The projects are independent
# flat-namespace programs that share module basenames (judge.py, config.py,
# test_helpers.py); one combined run lets a sibling's module shadow
# another's and emits spurious no-member / no-name-in-module errors. A
# project may add its own .pylintrc later if it ever needs divergent rules.
reports = "no"

# Wrap at pylint's default 100-char budget — made EXPLICIT so the
# convention is enforced and documented rather than inherited (and so a
# future pylint default change cannot silently move it). The historic
# ~78-col wrapping was a leftover, not a rule; new code should use the
# full 100-char width.
max-line-length = 100

[tool.pylint."messages control"]
# Deterministic hard gate: exit non-zero on ANY emitted message
# (convention through fatal). Pylint 4's `fail-under` is score-based and
# cannot zero it out reliably; `fail-on` maps 1:1 to "any message →
# non-zero exit" (verified: convention-only file exits 16, clean exits 0).
fail-on = ["C", "W", "R", "E", "F"]

# Repo-wide convention with written rationale: the scripts projects live
# in flat namespaces and deliberately share underscore-prefixed helpers
# across sibling modules (their "internal API"). Tests white-box the same
# helpers. Expected until the API-promotion spec lands; see
# docs/superpowers/specs/2026-09-07-script-api-promotion-design.md
#
# wrong-import-position: every flat-namespace script does a
# sys.path.insert(0, <scripts dir>) bootstrap BEFORE its sibling imports,
# so those imports necessarily sit below the bootstrap line. This is the
# repo's deliberate file convention (spec 2026-09-07-pylint-clean-refactor,
# "C0413 -> Suppress"). LIVE message in the CI-pinned pylint 4.0.8 — it
# fires on any pragma-less mid-file import (verified empirically; a
# file-wide pragma naming it does NOT raise W0012). Do NOT strip this
# disable as "stale": pylint 4.0.8 still has the message. Commit
# 1e10a2f stripped the per-file pragmas on exactly this false premise
# and CI went red (49x C0413) — repo-wide here so per-file cleanup
# passes cannot reintroduce the failure.
disable = [
    "wrong-import-position",
]