name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r p2p-qa-lab/requirements.txt
        pip install pylint==4.0.8
    - name: Analysing the code with pylint
      # Each top-level directory is an independent flat-namespace project that
      # shares module basenames (judge.py, config.py, test_helpers.py). One
      # combined pylint run lets a sibling project's module shadow another's
      # and emits spurious no-member / no-name-in-module errors, so lint every
      # project in its own invocation under the shared root pylint config.
      run: |
        mapfile -t projects < <(git ls-files '*.py' | awk -F/ 'NF>1 {print $1}' | sort -u)
        for project in "${projects[@]}"; do
          echo "::group::pylint $project"
          pylint $(git ls-files "$project/*.py")
          echo "::endgroup::"
        done
