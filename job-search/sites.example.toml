# Job-search site list — EXAMPLE ONLY.
#
# Copy to sites.toml (gitignored) and list your real sites. Every entry:
#   name    — label used in reports
#   url     — the site's search URL WITH its own remote+US filter params and
#             (where supported) a last-24h date filter baked in. Anything the
#             site returns is trusted as US-remote (spec §4) — a site whose
#             URL lacks a remote+US filter gets its postings flagged review.
#   adapter — platform adapter: greenhouse | ashby | workday | shopify |
#             phenom | pcsx | servicenow | hiringcafe | linkedin-guest
#   auth    — none | curl-feed
#
# Fictional example entries follow.

[[site]]
name = "Example Corp Careers"
url = "https://boards.greenhouse.io/examplecorp"
adapter = "greenhouse"
auth = "none"
notes = "Placeholder entry. Greenhouse boards need no auth."
